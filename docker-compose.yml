services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: bharath_sentinel_postgis
    environment:
      POSTGRES_DB: bharath_sentinel_db
      POSTGRES_USER: bharath_sentinel_user
      POSTGRES_PASSWORD: bharath_sentinel_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bharath_sentinel_user -d bharath_sentinel_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bharath_sentinel_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://bharath_sentinel_user:bharath_sentinel_password@postgres:5432/bharath_sentinel_db
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bharath_sentinel_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
